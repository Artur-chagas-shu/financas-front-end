<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pro | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
   
       
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2><i class="fas fa-coins"></i> Finanças Pro</h2>
            <!-- Formulário de login -->
            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="loginEmail" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Senha</label>
                    <input type="password" id="loginSenha" required placeholder="••••••">
                </div>
                <button type="submit" class="btn-primary btn-block">Entrar</button>
                <div class="toggle-link" id="showRegisterLink">Criar uma conta</div>
                <div id="loginError" class="error-message"></div>
            </form>
            <!-- Formulário de cadastro (inicialmente oculto) -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nome</label>
                    <input type="text" id="registerNome" required placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="registerEmail" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Senha</label>
                    <input type="password" id="registerSenha" required placeholder="Mínimo 6 caracteres">
                </div>
                <button type="submit" class="btn-primary btn-block">Cadastrar</button>
                <div class="toggle-link" id="showLoginLink">Voltar ao login</div>
                <div id="registerError" class="error-message"></div>
            </form>
        </div>
    </div>
    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
